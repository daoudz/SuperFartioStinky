<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b130e">
    <title>SUPER FARTIO BROS. - World 1: The Sewer Kingdom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Orientation Prompt for Mobile Portrait Mode -->
    <div id="rotate-prompt" class="rotate-prompt-overlay" aria-live="polite">
        <div class="rotate-card">
            <div class="rotate-animation">
                <div class="phone-device">
                    <div class="phone-screen-inner">
                        <span class="rotate-stink-icon">💨</span>
                    </div>
                </div>
                <div class="rotate-arrow-badge">⟳</div>
            </div>
            <h2>PLEASE ROTATE DEVICE</h2>
            <p class="rotate-main-text">SUPER FARTIO BROS. is an arcade side-scroller designed for <strong>LANDSCAPE</strong> mode.</p>
            <p class="rotate-sub">Turn your phone sideways for the optimal sewer experience!</p>
            <button id="btn-dismiss-rotate" class="retro-btn dismiss-btn" title="Continue in portrait">Play in Portrait Anyway ➔</button>
        </div>
    </div>

    <div id="arcade-wrapper" class="arcade-wrapper">
        <header class="game-header">
            <div class="title-badge">
                <span class="stink-icon">💨</span>
                <h1>SUPER FARTIO BROS.</h1>
                <span class="stink-icon">💩</span>
            </div>
            <div class="level-selector" aria-label="Select Level">
                <button class="retro-btn lvl-btn active" data-level="1" title="World 1-1: The Great Sewer">1-1</button>
                <button class="retro-btn lvl-btn" data-level="2" title="World 1-2: Toxic Pipeworks">1-2</button>
                <button class="retro-btn lvl-btn" data-level="3" title="World 1-3: Septic Lagoon">1-3</button>
                <button class="retro-btn lvl-btn" data-level="4" title="World 1-4: King Poopa's Citadel">1-4 👑</button>
            </div>
            <div class="top-controls">
                <button id="btn-fullscreen" class="retro-btn" title="Toggle Full Screen Mode">⛶ FULLSCREEN</button>
                <button id="btn-music" class="retro-btn" title="Toggle Sewer Chiptune Music">🎵 BGM: ON</button>
                <button id="btn-crt" class="retro-btn active" title="Toggle CRT Scanlines">📺 CRT: ON</button>
                <button id="btn-restart" class="retro-btn" title="Restart Level (R)">🔄 RESTART</button>
            </div>
        </header>

        <div id="canvas-container" class="crt-effect">
            <canvas id="gameCanvas" width="800" height="480"></canvas>

            <!-- On-Screen Virtual Touch Gamepad for Mobile (Android & iOS) -->
            <div id="touch-controls" class="touch-controls-layer" aria-label="Touch Controls">
                <div class="touch-group touch-dpad">
                    <button id="touch-left" class="touch-btn dpad-btn" aria-label="Move Left">
                        <span class="btn-icon">◀</span>
                    </button>
                    <button id="touch-right" class="touch-btn dpad-btn" aria-label="Move Right">
                        <span class="btn-icon">▶</span>
                    </button>
                </div>

                <div class="touch-group touch-actions">
                    <button id="touch-shoot" class="touch-btn action-btn shoot-btn" aria-label="Shoot Gas / Sprint">
                        <span class="btn-icon">☣️</span>
                        <span class="btn-sub">GAS</span>
                    </button>
                    <button id="touch-jump" class="touch-btn action-btn jump-btn" aria-label="Fart Jump">
                        <span class="btn-icon">💨</span>
                        <span class="btn-sub">JUMP</span>
                    </button>
                </div>
            </div>
        </div>

        <footer class="controls-panel">
            <div class="control-group">
                <span class="key-badge">A / D</span> or <span class="key-badge">◀ / ▶</span>
                <span class="control-label">Move</span>
            </div>
            <div class="control-group">
                <span class="key-badge">W / SPACE / ▲</span>
                <span class="control-label">Fart Jump</span>
            </div>
            <div class="control-group">
                <span class="key-badge">X / SHIFT / J</span>
                <span class="control-label">Shoot Gas / Sprint</span>
            </div>
            <div class="control-group">
                <span class="key-badge">1 - 4</span>
                <span class="control-label">Warp Level</span>
            </div>
            <div class="control-group">
                <span class="key-badge">R</span>
                <span class="control-label">Restart</span>
            </div>
        </footer>
    </div>

    <script src="audio.js"></script>
    <script src="sprites.js"></script>
    <script src="game.js"></script>
</body>
</html>
