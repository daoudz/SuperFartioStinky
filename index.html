<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER FARTIO BROS. - World 1: The Sewer Kingdom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="arcade-wrapper">
        <header class="game-header">
            <div class="title-badge">
                <span class="stink-icon">💨</span>
                <h1>SUPER FARTIO BROS.</h1>
                <span class="stink-icon">💩</span>
            </div>
            <div class="level-selector" aria-label="Select Level">
                <button class="retro-btn lvl-btn active" data-level="1" title="World 1-1: The Great Sewer">1-1</button>
                <button class="retro-btn lvl-btn" data-level="2" title="World 1-2: Toxic Pipeworks">1-2</button>
                <button class="retro-btn lvl-btn" data-level="3" title="World 1-3: Septic Lagoon">1-3</button>
                <button class="retro-btn lvl-btn" data-level="4" title="World 1-4: King Poopa's Citadel">1-4 👑</button>
            </div>
            <div class="top-controls">
                <button id="btn-music" class="retro-btn" title="Toggle Sewer Chiptune Music">🎵 BGM: ON</button>
                <button id="btn-crt" class="retro-btn active" title="Toggle CRT Scanlines">📺 CRT: ON</button>
                <button id="btn-restart" class="retro-btn" title="Restart Level (R)">🔄 RESTART</button>
            </div>
        </header>

        <div id="canvas-container" class="crt-effect">
            <canvas id="gameCanvas" width="800" height="480"></canvas>
        </div>

        <footer class="controls-panel">
            <div class="control-group">
                <span class="key-badge">A / D</span> or <span class="key-badge">◀ / ▶</span>
                <span class="control-label">Move</span>
            </div>
            <div class="control-group">
                <span class="key-badge">W / SPACE / ▲</span>
                <span class="control-label">Fart Jump</span>
            </div>
            <div class="control-group">
                <span class="key-badge">X / SHIFT / J</span>
                <span class="control-label">Shoot Gas / Sprint</span>
            </div>
            <div class="control-group">
                <span class="key-badge">1 - 4</span>
                <span class="control-label">Warp Level</span>
            </div>
            <div class="control-group">
                <span class="key-badge">R</span>
                <span class="control-label">Restart</span>
            </div>
        </footer>
    </div>

    <script src="audio.js"></script>
    <script src="sprites.js"></script>
    <script src="game.js"></script>
</body>
</html>
